pre-commit:
  commands:
    format:
      run: mise exec -- cargo fmt --all -- --check
    node-lint:
      run: mise run lint:node
    node-format:
      run: mise run check:node:format
    whitespace:
      run: git diff --cached --check

pre-push:
  commands:
    test:
      run: mise exec -- cargo test --workspace
    clippy:
      run: mise exec -- cargo clippy --workspace --all-targets -- -D warnings
