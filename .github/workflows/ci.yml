name: Rust and TypeScript engines

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: core-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: Rust (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm, macos-15, macos-15-intel, windows-2025, windows-11-arm]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4
        with:
          install_args: rust
          cache: false
      - name: Debug tests
        run: mise exec -- cargo test --workspace --all-features --locked
      - name: Release tests
        run: mise exec -- cargo test --workspace --all-features --release --locked

  typescript:
    name: TypeScript (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4
        with:
          install_args: node pnpm
          cache: false
      - name: Install dependencies
        run: mise exec -- pnpm install --frozen-lockfile
      - name: Build and test package
        run: mise run check:node
      - name: TypeScript project checks
        run: mise run check:typescript
      - name: Development task contracts
        if: runner.os == 'Linux'
        run: mise run check:node:tools
      - name: Minimum Node runtime
        if: runner.os == 'Linux'
        run: mise run check:node:minimum
      - name: TypeScript benchmark contracts
        if: runner.os == 'Linux'
        run: mise run check:node:bench

  browsers:
    name: Browser and module Worker
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4
        with:
          install_args: node pnpm
          cache: false
      - name: Install dependencies
        run: mise exec -- pnpm install --frozen-lockfile
      - name: Install Chromium, Firefox and WebKit
        run: mise exec -- pnpm --dir packages/ziwei exec playwright install --with-deps chromium firefox webkit
      - name: Build package
        run: mise run build:node
      - name: Browser and Worker contracts
        run: mise run test:browser

  quality:
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4
        with:
          install_args: rust node pnpm
          cache: false
      - name: Install quality components and dependencies
        run: |
          mise exec -- rustup component add rustfmt clippy
          mise exec -- pnpm install --frozen-lockfile
      - name: TypeScript lint and format
        run: |
          mise run lint:node
          mise run check:node:format
      - name: Rust format, Clippy and docs
        run: |
          mise exec -- cargo fmt --all -- --check
          mise exec -- cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
          mise exec -- cargo rustdoc -p ziwei --lib --locked -- -D warnings
      - name: Minimum Rust
        run: mise run check:msrv
      - name: Markdown examples and development tools
        run: |
          mise exec -- cargo build -p ziwei --locked
          mise exec -- rustdoc --edition 2024 --test README.md --extern ziwei=target/debug/libziwei.rlib -L dependency=target/debug/deps
          mise exec -- rustdoc --edition 2024 --test docs/architecture/rust-package-design.md --extern ziwei=target/debug/libziwei.rlib -L dependency=target/debug/deps
          mise run check:tools
          mise run check:tools:e2e
          mise run check:package

  verify:
    needs: [rust, typescript, browsers, quality]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-26.04
    timeout-minutes: 1
    steps:
      - name: Require all checks
        env:
          RUST_RESULT: ${{ needs.rust.result }}
          TS_RESULT: ${{ needs.typescript.result }}
          BROWSER_RESULT: ${{ needs.browsers.result }}
          QUALITY_RESULT: ${{ needs.quality.result }}
        run: |
          test "$RUST_RESULT" = success
          test "$TS_RESULT" = success
          test "$BROWSER_RESULT" = success
          test "$QUALITY_RESULT" = success
