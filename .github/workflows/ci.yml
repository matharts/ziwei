name: Rust core

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      compare_windows_crt:
        description: Also build and retain the Windows x64 dynamic CRT baseline
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: core-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native-tests:
    name: Tests (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
          - os: macos-15
            target: aarch64-apple-darwin
          - os: macos-15-intel
            target: x86_64-apple-darwin
          - os: windows-2025
            target: x86_64-pc-windows-msvc
          - os: windows-11-arm
            target: aarch64-pc-windows-msvc
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    env:
      ZIWEI_NODE_TARGET: ${{ matrix.target }}
      CARGO_BUILD_TARGET: ${{ matrix.target }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4
        with:
          install_args: rust node pnpm
          # Rust is installed through rustup; see jdx/mise-action#215.
          cache: false
      - name: Install expected Rust target
        run: mise exec -- rustup target add "${{ matrix.target }}"
      - name: Tests
        run: mise exec -- cargo test --workspace --all-features --locked
      - name: Release tests
        run: mise exec -- cargo test --workspace --all-features --release --locked
      - name: Install Node adapter development dependencies
        run: mise exec -- pnpm install --frozen-lockfile
      - name: Node development runtime contracts
        run: mise run check:node:tools
      # Optional diagnostic baseline; normal builds use the shared mise static policy.
      - name: Record Windows x64 dynamic CRT baseline
        if: matrix.target == 'x86_64-pc-windows-msvc' && inputs.compare_windows_crt == true
        env:
          CARGO_TARGET_X86_64_PC_WINDOWS_MSVC_RUSTFLAGS: -C target-feature=-crt-static
        run: |
          mise run build:node:native
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          mise run check:node:windows-crt -- dynamic packages/ziwei/native/ziwei-native.win32-x64-msvc.node target/windows-crt
      - name: Record Windows x64 static CRT artifact
        if: matrix.target == 'x86_64-pc-windows-msvc'
        run: |
          mise run build:node:native
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          mise run check:node:windows-crt -- static packages/ziwei/native/ziwei-native.win32-x64-msvc.node target/windows-crt
      - name: Windows x64 static CRT integration and type contracts
        if: matrix.target == 'x86_64-pc-windows-msvc'
        env:
          ZIWEI_NODE_ARTIFACTS: target/node-artifacts
        # Reuse the inspected native bytes. check:node would build the DLL again.
        run: |
          mise run build:node:ts
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          mise run test:node
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          mise run check:node:types
      - name: Node adapter integration and type contracts
        if: runner.os != 'Linux' && matrix.target != 'x86_64-pc-windows-msvc'
        env:
          ZIWEI_NODE_ARTIFACTS: target/node-artifacts
        run: mise run check:node
      - name: GNU adapter integration using the compatibility toolchain
        if: runner.os == 'Linux'
        env:
          ZIWEI_NODE_ARTIFACTS: target/node-artifacts
        run: |
          mise run build:node:gnu
          mise run test:node
          mise run check:node:types
      - name: TypeScript tooling and test contracts
        run: mise run check:typescript
      - name: Minimum supported Node runtime
        if: matrix.target == 'x86_64-unknown-linux-gnu'
        run: mise run check:node:minimum
      - name: Node benchmark contract tests (smoke only, no performance gate)
        if: matrix.target == 'x86_64-unknown-linux-gnu'
        run: mise run check:node:bench
      - name: Upload tested distribution inputs
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: node-distribution-${{ github.run_attempt }}-${{ matrix.target }}
          path: target/node-artifacts/node-distribution-${{ github.run_attempt }}-${{ matrix.target }}/
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
      - name: Preserve Windows x64 CRT evidence
        if: ${{ !cancelled() && matrix.target == 'x86_64-pc-windows-msvc' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: windows-crt-${{ github.run_attempt }}
          path: target/windows-crt/
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

  musl-distribution:
    name: Distribution (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-musl
            docker-platform: linux/amd64
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
            docker-platform: linux/arm64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    env:
      CARGO_BUILD_TARGET: ${{ matrix.target }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4
        with:
          install_args: rust node pnpm
          cache: false
      - name: Install musl Rust target
        run: mise exec -- rustup target add "$CARGO_BUILD_TARGET"
      - name: Build and pack musl distribution without publishing
        run: |
          mise exec -- pnpm install --frozen-lockfile
          mise run build:node:musl
          mise run check:node:types
          mise run pack:node -- --target "$CARGO_BUILD_TARGET"
      - name: Clean Alpine consumer on the target CPU (no emulation)
        env:
          DOCKER_PLATFORM: ${{ matrix.docker-platform }}
        run: |
          docker run --rm --platform "$DOCKER_PLATFORM" \
            --mount "type=bind,src=$PWD,dst=/work,readonly" \
            -e ZIWEI_NPM_CLI=/usr/local/lib/node_modules/npm/bin/npm-cli.js \
            node:24.21.0-alpine3.23 sh -eu -c '
              for artifacts in /work/target/node-distribution/ziwei-*; do
                node /work/packages/ziwei/test/fixtures/distribution-consumer.ts "$artifacts"
              done
            '
      - name: Seal the tested Alpine tarballs
        run: |
          for artifacts in target/node-distribution/ziwei-*; do
            mise run capture:node -- --input "$artifacts" --target "$CARGO_BUILD_TARGET"
          done
      - name: Upload tested distribution inputs
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: node-distribution-${{ github.run_attempt }}-${{ matrix.target }}
          path: target/node-artifacts/node-distribution-${{ github.run_attempt }}-${{ matrix.target }}/
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

  node-distribution:
    name: Complete Node distribution
    needs: [native-tests, musl-distribution, quality]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4
        with:
          install_args: node pnpm
          cache: false
      - name: Install distribution tooling
        run: mise exec -- pnpm install --frozen-lockfile
      - name: Download this attempt only, keeping targets separate
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: node-distribution-${{ github.run_attempt }}-*
          path: target/node-artifacts
          merge-multiple: false
      - name: Validate and assemble without rebuilding
        run: mise run assemble:node -- --input target/node-artifacts
      - name: Require GNU artifacts to stay within glibc 2.28
        run: |
          for artifacts in target/node-distribution-complete/ziwei-*; do
            mise run check:node:glibc -- "$artifacts"
          done
      - name: Upload the complete private distribution
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: node-distribution-${{ github.run_attempt }}
          path: |
            target/node-distribution-complete/ziwei-*/*.tgz
            target/node-distribution-complete/ziwei-*/artifacts.json
            target/node-distribution-complete/ziwei-*/batch.json
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

  registry-consumers:
    name: Registry (${{ matrix.target }})
    needs: node-distribution
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
          - os: macos-15
            target: aarch64-apple-darwin
          - os: macos-15-intel
            target: x86_64-apple-darwin
          - os: windows-2025
            target: x86_64-pc-windows-msvc
          - os: windows-11-arm
            target: aarch64-pc-windows-msvc
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-musl
            docker-platform: linux/amd64
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
            docker-platform: linux/arm64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: node-distribution-${{ github.run_attempt }}
          path: target/node-registry
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4
        if: ${{ !matrix.docker-platform }}
        with:
          install_args: node pnpm
          cache: false
      - name: Clean npm and pnpm consumers of the same complete cohort
        if: ${{ !matrix.docker-platform }}
        shell: bash
        run: |
          for artifacts in target/node-registry/ziwei-*; do
            mise run check:node:registry -- "$artifacts"
          done
      - name: Clean glibc 2.28 consumers with the minimum Node on the target CPU
        if: endsWith(matrix.target, '-linux-gnu')
        shell: bash
        run: |
          mise install node@24.15.0
          node_root=$(mise exec node@24.15.0 -- node -p 'require("node:path").dirname(require("node:path").dirname(process.execPath))')
          node_arch=$(mise exec node@24.15.0 -- node -p 'process.arch')
          case "$node_arch" in
            x64) docker_platform=linux/amd64 ;;
            arm64) docker_platform=linux/arm64 ;;
            *) exit 1 ;;
          esac
          docker run --rm --platform "$docker_platform" \
            --mount "type=bind,src=$PWD,dst=/work,readonly" \
            --mount "type=bind,src=$node_root,dst=/opt/node,readonly" \
            -e EXPECTED_NODE_ARCH="$node_arch" \
            -e GITHUB_SHA -e GITHUB_RUN_ID -e GITHUB_RUN_ATTEMPT \
            almalinux:8.10-20260902 bash -eu -c '
              dnf install -y --setopt=install_weak_deps=False ca-certificates tar gzip libstdc++
              export PATH=/opt/node/bin:$PATH
              node -e "const a=require(\"node:assert/strict\"); a.equal(process.platform,\"linux\"); a.equal(process.arch,process.env.EXPECTED_NODE_ARCH); a.equal(process.version,\"v24.15.0\"); a.equal(process.report.getReport().header.glibcVersionRuntime,\"2.28\"); console.log({node:process.version,arch:process.arch,glibc:process.report.getReport().header.glibcVersionRuntime})"
              pnpm_version=$(node -p "require(\"/work/package.json\").devEngines.packageManager.version")
              node_arch=$(node -p "process.arch")
              npm install --prefix /tmp/pnpm-tool --ignore-scripts --no-audit --no-fund \
                "@pnpm/exe.linux-${node_arch}@${pnpm_version}"
              export ZIWEI_PNPM_BIN="/tmp/pnpm-tool/node_modules/@pnpm/exe.linux-${node_arch}/pnpm"
              for artifacts in /work/target/node-registry/ziwei-*; do
                node /work/packages/ziwei/test/fixtures/registry-consumer.ts "$artifacts"
              done
            '
      - name: Clean Alpine registry consumers on the target CPU
        if: matrix.docker-platform
        env:
          DOCKER_PLATFORM: ${{ matrix.docker-platform }}
        run: |
          docker run --rm --platform "$DOCKER_PLATFORM" \
            --mount "type=bind,src=$PWD,dst=/work,readonly" \
            -e GITHUB_SHA -e GITHUB_RUN_ID -e GITHUB_RUN_ATTEMPT \
            node:24.21.0-alpine3.23 sh -eu -c '
              pnpm_version=$(node -p "require(\"/work/package.json\").devEngines.packageManager.version")
              node_arch=$(node -p "process.arch")
              npm install --prefix /tmp/pnpm-tool --ignore-scripts --no-audit --no-fund \
                "@pnpm/exe.linux-${node_arch}-musl@${pnpm_version}"
              export ZIWEI_PNPM_BIN="/tmp/pnpm-tool/node_modules/@pnpm/exe.linux-${node_arch}-musl/pnpm"
              for artifacts in /work/target/node-registry/ziwei-*; do
                node /work/packages/ziwei/test/fixtures/registry-consumer.ts "$artifacts"
              done
            '

  windows-clean-consumer:
    name: Windows x64 clean consumers
    needs: node-distribution
    runs-on: windows-2025
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: node-distribution-${{ github.run_attempt }}
          path: target/node-registry
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4
        with:
          install_args: node pnpm
          cache: false
      - name: Verify clean npm and runtime-equipped pnpm against the sealed cohort
        shell: pwsh
        run: |
          $cohorts = @(Get-ChildItem target/node-registry -Directory)
          if ($cohorts.Count -ne 1) { throw 'Expected exactly one complete cohort' }
          mise run check:node:windows -- $cohorts[0].FullName "$PWD/target/windows-clean-consumer"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Preserve Windows consumer evidence, including failures
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: windows-clean-consumer-${{ github.run_attempt }}
          path: target/windows-clean-consumer/
          if-no-files-found: error
          retention-days: 7

  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # Official action releases; full SHA pins, no persisted write credentials.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4
        with:
          install_args: rust node pnpm
          # Rust is installed through rustup; see jdx/mise-action#215.
          cache: false
      - name: Install quality components
        run: mise exec -- rustup component add rustfmt clippy
      - name: Install Node quality tools
        run: mise exec -- pnpm install --frozen-lockfile
      - name: TypeScript lint
        run: mise run lint:node
      - name: Node formatting
        run: mise run check:node:format
      - name: Format
        run: mise exec -- cargo fmt --all -- --check
      - name: Clippy
        run: mise exec -- cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
      - name: Rustdoc
        run: mise exec -- cargo rustdoc -p ziwei --lib --locked -- -D warnings
      - name: Minimum supported Rust
        run: mise run check:msrv
      - name: Markdown examples
        run: |
          mise exec -- cargo build -p ziwei --locked
          mise exec -- rustdoc --edition 2024 --test README.md --extern ziwei=target/debug/libziwei.rlib -L dependency=target/debug/deps
          mise exec -- rustdoc --edition 2024 --test docs/architecture/rust-package-design.md --extern ziwei=target/debug/libziwei.rlib -L dependency=target/debug/deps
      - name: Rust development tools
        run: mise run check:tools
      - name: Development tools end-to-end smoke only
        run: mise run check:tools:e2e
      - name: Verify package without publishing
        run: mise run check:package

  # Keep a single stable check that cannot pass when a required job fails or skips.
  verify:
    needs: [native-tests, musl-distribution, quality, node-distribution, registry-consumers, windows-clean-consumer]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 1
    steps:
      - name: Require all checks
        env:
          NATIVE_RESULT: ${{ needs.native-tests.result }}
          MUSL_RESULT: ${{ needs.musl-distribution.result }}
          QUALITY_RESULT: ${{ needs.quality.result }}
          DISTRIBUTION_RESULT: ${{ needs.node-distribution.result }}
          REGISTRY_RESULT: ${{ needs.registry-consumers.result }}
          WINDOWS_CLEAN_RESULT: ${{ needs.windows-clean-consumer.result }}
        run: |
          test "$NATIVE_RESULT" = success
          test "$MUSL_RESULT" = success
          test "$QUALITY_RESULT" = success
          test "$DISTRIBUTION_RESULT" = success
          test "$REGISTRY_RESULT" = success
          test "$WINDOWS_CLEAN_RESULT" = success
