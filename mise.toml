[tools]
lefthook = "2.1.12"
rust = "1.98.1"
node = "24.21.0"
# Only the macOS x64 npm backend needs pnpm's reviewed native-binary setup script.
pnpm = { version = "12.3.4", allow_builds = ["pnpm"] }

[settings]
# CI may already have tool directories on PATH without a mise activation record.
activate_aggressive = true

[tasks."build:node"]
description = "构建本机 Node 适配包；不发布"
run = [{ task = "build:node:native" }, { task = "build:node:ts" }]

[tasks."build:node:native"]
description = "构建 Node 原生绑定；默认本机，可用 CARGO_BUILD_TARGET 指定目标"
dir = "packages/ziwei"
# Only this addon task defaults x64 MSVC to static CRT. An explicit target override
# remains available for the on-demand comparison; unrelated Cargo builds are unchanged.
env.CARGO_TARGET_X86_64_PC_WINDOWS_MSVC_RUSTFLAGS = "{{ env.CARGO_TARGET_X86_64_PC_WINDOWS_MSVC_RUSTFLAGS | default(value='-C target-feature=+crt-static') }}"
usage = '''
flag "--cross-compile" help="使用 napi-rs 的 Zig／xwin 交叉链接工具链"
flag "--use-napi-cross" help="在 Linux 上使用 napi-rs 的 GNU 交叉工具链"
'''
run = "pnpm exec -- node node_modules/@napi-rs/cli/dist/cli.js build {% if usage.cross_compile %}--cross-compile {% endif %}{% if usage.use_napi_cross %}--use-napi-cross {% endif %}--manifest-path ../../bindings/node/Cargo.toml --package ziwei-node --platform --release --output-dir native --js binding.cjs --dts binding.d.cts -- --locked"

[tasks."build:node:gnu"]
description = "在 Linux 上交叉链接 GNU 包；完整分发仍须通过 glibc 2.28 验收"
run = [
  { task = "build:node:native", args = ["--use-napi-cross"] },
  { task = "build:node:ts" },
]

[tasks."build:node:musl"]
description = "使用锁定的 Zig 工具链构建 CARGO_BUILD_TARGET 指定的 musl 包"
run = [
  "mise run --tool zig@0.16.0 --tool aqua:rust-cross/cargo-zigbuild@0.23.4 build:node:native --cross-compile",
  { task = "build:node:ts" },
]

[tasks."build:node:ts"]
description = "通过 Rslib 构建 ESM 与类型声明；需已有原生绑定"
dir = "packages/ziwei"
run = "pnpm exec -- node node_modules/@rslib/core/bin/rslib.js build"

[tasks."test:node"]
description = "验证已构建 Node 包的公开入口"
run = "pnpm exec -- node node_modules/@rstest/core/bin/rstest.js --project ziwei"

[tasks."pack:node"]
description = "将已构建的指定目标打包到独立暂存区；不发布"
run = "pnpm exec -- node packages/ziwei/tools/pack.ts"

[tasks."capture:node"]
description = "封存已通过消费端验收的单目标 tarball 与 CI 批次校验清单"
run = "pnpm exec -- node packages/ziwei/tools/artifacts.ts capture"

[tasks."assemble:node"]
description = "严格汇总同一 CI attempt 的全部平台产物；不重新构建或发布"
run = "pnpm exec -- node packages/ziwei/tools/artifacts.ts assemble"

[tasks."check:node:registry"]
description = "用 npm 和 pnpm 验证完整 tarball 批次的自动平台安装；仅本机只读注册表"
run = "pnpm exec -- node packages/ziwei/test/fixtures/registry-consumer.ts"

[tasks."check:node:glibc"]
description = "检查完整批次中 GNU 二进制的架构、摘要与 glibc 2.28 符号上限；需要 readelf"
run = "pnpm exec -- node packages/ziwei/tools/compatibility.ts"

[tasks."check:node:macos"]
description = "检查完整批次的双架构 Mach-O、系统版本标记与动态库路径；不代表最低系统实测"
run = "pnpm exec -- node packages/ziwei/tools/compatibility.ts --macos"

[tasks."check:node:windows"]
description = "分别验收无额外 CRT 的 npm 与具备自身运行库的 pnpm；需要 Windows x64 Docker"
run = "pnpm exec -- node packages/ziwei/tools/windows-container.ts"

[tasks."check:node:windows-crt"]
description = "检查 Windows x64 实际 PE 依赖并记录摘要与大小；动态模式仅供按需对照"
run = "pnpm exec -- node packages/ziwei/tools/compatibility.ts --windows-crt"

[tasks."check:node:windows-arm64"]
description = "检查完整批次的 Windows ARM64 PE、导入依赖与摘要；不代表干净系统实测"
run = "pnpm exec -- node packages/ziwei/tools/compatibility.ts --windows-arm64"

[tasks."check:node:types"]
description = "验证已构建 Node 包的 TypeScript 消费端合同"
dir = "packages/ziwei"
run = "pnpm exec -- node node_modules/typescript/bin/tsc --project test/tsconfig.json"

[tasks."check:node"]
description = "构建 Node 适配包并验证公开入口与类型合同"
depends = ["build:node"]
run = [
  { task = "test:node" },
  { task = "check:node:types" },
]

[tasks."check:node:tools"]
description = "验证 Node 开发入口、子进程运行时及 PATH 遮蔽；不运行排盘基准"
run = "pnpm exec -- node node_modules/@rstest/core/bin/rstest.js --project node-tools"

[tasks."check:typescript"]
description = "严格检查 TypeScript 配置、测试和工具；需先构建 Node 包"
run = "pnpm exec -- node node_modules/typescript/bin/tsc --project tsconfig.json"

[tasks."lint:node"]
description = "使用 Oxlint 检查 TypeScript 源码、配置、测试与工具；警告视为失败"
run = "pnpm exec -- node node_modules/oxlint/bin/oxlint --deny-warnings packages tools/tests rstest.config.ts"

[tasks."lint:node:fix"]
description = "使用 Oxlint 应用安全修复；不应用建议或危险修复"
run = "pnpm exec -- node node_modules/oxlint/bin/oxlint --fix --deny-warnings packages tools/tests rstest.config.ts"

[tasks."format:node"]
description = "使用 Oxfmt 格式化手写 TypeScript 与 Node JSON 配置"
run = 'pnpm exec -- node node_modules/oxfmt/bin/oxfmt "packages/**/*.{ts,json,jsonc}" "tools/tests/**/*.ts" rstest.config.ts package.json tsconfig.json .oxlintrc.json .oxfmtrc.json'

[tasks."check:node:format"]
description = "检查 Oxfmt 格式；不修改文件"
run = 'pnpm exec -- node node_modules/oxfmt/bin/oxfmt --check "packages/**/*.{ts,json,jsonc}" "tools/tests/**/*.ts" rstest.config.ts package.json tsconfig.json .oxlintrc.json .oxfmtrc.json'

[tasks."check:node:minimum"]
description = "以最低 Node 24.15.0 验证 ESM 构建、包消费端及 TS 工具"
depends = ["build:node"]
run = [
  "mise run --tool node@24.15.0 build:node:ts",
  "mise run --tool node@24.15.0 test:node",
  "mise run --tool node@24.15.0 check:node:types",
  "mise run --tool node@24.15.0 check:typescript",
  "mise run --tool node@24.15.0 lint:node",
  "mise run --tool node@24.15.0 check:node:format",
  "mise exec node@24.15.0 -- node packages/ziwei/bench/run.ts --help",
]

[tasks."benchmark:smoke"]
description = "建盘基准冒烟检查；不形成正式性能基线"
run = "cargo run --quiet --manifest-path tools/xtask/Cargo.toml --locked -- benchmark smoke"

[tasks."benchmark:node"]
description = "Node 公开 API 固定语料测量；构建当前包，不登记正式基线"
run = "pnpm exec -- node packages/ziwei/bench/run.ts"

[tasks."benchmark:node:smoke"]
description = "Node 公开 API 冒烟；保存记录，不设置性能阈值"
run = "pnpm exec -- node packages/ziwei/bench/run.ts --smoke"

[tasks."check:node:bench"]
description = "串行验证 Node 基准 CLI、记录合同与真实冒烟；与包功能测试分开"
run = "pnpm exec -- node node_modules/@rstest/core/bin/rstest.js --project node-bench"

[tasks."benchmark:calibrate"]
description = "本机重复建盘测量；默认 20 轮"
run = "cargo run --quiet --manifest-path tools/xtask/Cargo.toml --locked -- benchmark calibrate"

[tasks."benchmark:read:smoke"]
description = "读取基准冒烟与元数据校验；不形成正式性能基线"
run = "cargo run --quiet --manifest-path tools/xtask/Cargo.toml --locked -- benchmark-read smoke"

[tasks."benchmark:read:calibrate"]
description = "读取基准独立校准；20 轮，保持与建盘基准分离"
run = "cargo run --quiet --manifest-path tools/xtask/Cargo.toml --locked -- benchmark-read calibrate"

[tasks."check:package"]
description = "验证打包产物的独立 Rust 消费端；不发布"
run = "cargo run --quiet --manifest-path tools/xtask/Cargo.toml --locked -- check-package"

[tasks."check:tools"]
description = "Rust 开发工具的格式、Clippy 与快速测试；不运行真实基准负载"
run = [
  "cargo fmt --manifest-path tools/xtask/Cargo.toml -- --check",
  "cargo clippy --manifest-path tools/xtask/Cargo.toml --all-targets --locked -- -D warnings",
  "cargo test --manifest-path tools/xtask/Cargo.toml --locked",
]

[tasks."check:tools:e2e"]
description = "串行验证两套真实基准冒烟与输出合同；不形成性能基线"
run = "cargo test --manifest-path tools/xtask/Cargo.toml --locked --test cli -- --ignored --test-threads=1"

[tasks."check:msrv"]
description = "使用最低 Rust 1.98.0 验证核心与工具，不改变默认工具链"
run = [
  "mise exec rust@1.98.0 -- cargo test --workspace --all-features --locked --target-dir target/msrv",
  "mise exec rust@1.98.0 -- cargo test --manifest-path tools/xtask/Cargo.toml --locked --target-dir target/msrv/xtask",
  "mise exec rust@1.98.0 -- cargo test --manifest-path tools/xtask/Cargo.toml --locked --target-dir target/msrv/xtask --test cli -- --ignored --test-threads=1",
]
