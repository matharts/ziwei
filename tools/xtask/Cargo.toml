#:schema https://raw.githubusercontent.com/rust-lang/cargo/rust-1.98.0/crates/cargo-util-schemas/manifest.schema.json

[package]
name = "ziwei-xtask"
version = "0.0.0"
edition = "2024"
rust-version = "1.98"
publish = false

# Development tools stay outside the published engine workspace.
[workspace]
resolver = "3"

[dependencies]
anyhow = "1"
flate2 = "1"
serde_json = "1"
sha2 = "0.11"
tar = "0.4"
tempfile = "3"
time = { version = "0.3", features = ["formatting"] }

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
correctness = "deny"
