[workspace]
members = ["crates/ziwei", "bindings/node"]
default-members = ["crates/ziwei"]
resolver = "3"

[workspace.package]
edition = "2024"
rust-version = "1.98"
license = "MIT"
repository = "https://github.com/matharts/ziwei"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
correctness = "deny"
